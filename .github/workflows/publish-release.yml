name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: VetoDZ ${{ github.ref_name }}
          generate_release_notes: true
          files: VetoDZ-latest.apk
